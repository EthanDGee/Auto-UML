file_extensions:
  - cs
class_patterns:
  - class_declaration
  - interface_declaration
  - struct_declaration
function_patterns:
  - method_declaration
  - constructor_declaration
variable_patterns:
  - field_declaration
identifier_patterns:
  - identifier
  - variable_identifier
  - type_identifier
type_patterns:
  - type
  - predefined_type
  - array_type
  - identifier
parameter_container_patterns:
  - parameter_list
parameter_patterns:
  - parameter
wrapper_patterns:
  - variable_declaration
  - variable_declarator
type_field_names:
  - type
  - returns
skip_patterns:
  - modifier
import_patterns:
  - using_directive
namespace_patterns:
  - namespace_declaration
visibility_modifier_patterns:
  - modifier
private_by_default: false
public_modifier_patterns:
  - public
private_modifier_patterns:
  - private
  - protected
  - internal
class_type_parameter_patterns:
  - type_parameter_list