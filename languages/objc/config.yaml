file_extensions:
  - m
  - h
class_patterns:
  - class_interface
  - category_interface
  - protocol_declaration
function_patterns:
  - method_definition
  - method_declaration
variable_patterns:
  - property_declaration
  - field_declaration
identifier_patterns:
  - identifier
  - property_name
  - type_identifier
type_patterns:
  - type_name
  - primitive_type
  - type_identifier
  - sized_type_specifier
  - typedefed_specifier
  - generic_specifier
type_strip_suffixes:
  - "*"
parameter_container_patterns:
  - parameter_list
  - method_declaration
  - method_definition
parameter_patterns:
  - parameter_declaration
  - method_parameter
wrapper_patterns:
  - property_declaration
  - translation_unit
  - struct_declaration
  - struct_declarator
  - pointer_declarator
  - method_type
skip_patterns:
  - property_attributes
  - "@interface"
  - "@implementation"
  - "@property"
  - "@end"
  - NSObject
  - ":"
  - ";"
  - "("
  - ")"
  - "*"
  - long
  - class_implementation
  - implementation_definition
import_patterns:
  - preproc_import
  - preproc_include
visibility_modifier_patterns:
  - visibility_specifier
private_by_default: false
public_modifier_patterns:
  - public
  - "@public"
private_modifier_patterns:
  - private
  - "@private"
suppress_self_relations: true
