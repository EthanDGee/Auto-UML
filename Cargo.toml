[package]
build = "build.rs"
categories = ["command-line-utilities"]
description = "An automatic UML diagram generator for a variety of programming languages"
documentation = "https://github.com/EthanDGee/Auto-UML"
edition = "2024"
keywords = ["cli", "cli-tool", "UML", "documentation"]
license = "MIT"
name = "auto-uml"
readme = "README.md"
repository = "https://github.com/EthanDGee/Auto-UML"
version = "0.7.0"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
git2 = "0.20.4"
include_dir = "0.7.4"
serde = { version = "1.0", features = ["derive"] }
serde_yml = "0.0.12"
tree-sitter = "0.26.6"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-dart = "0.0.4"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin = { package = "tree-sitter-kotlin-ng", version = "1.1.0" }
tree-sitter-objc = "3.0.2"
tree-sitter-rust = "0.24.0"
tree-sitter-typescript = "0.23.2"

[build-dependencies]
glob = "0.3.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
